<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" rx="16" fill="#0B132B"/>
  <!-- Space Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="90" cy="80" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="340" cy="50" r="2" fill="#F6C94B" opacity="0.9"/>
  <circle cx="360" cy="220" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="40" cy="230" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- Central Sun with Glow -->
  <circle cx="200" cy="150" r="38" fill="#F6C94B" opacity="0.3"/>
  <circle cx="200" cy="150" r="28" fill="#F6C94B"/>
  <circle cx="200" cy="150" r="22" fill="#F59E0B"/>
  <!-- Orbit Rings (Ellipses) -->
  <ellipse cx="200" cy="150" rx="70" ry="26" stroke="#334155" stroke-width="1.5" fill="none"/>
  <ellipse cx="200" cy="150" rx="110" ry="42" stroke="#334155" stroke-width="1.5" fill="none"/>
  <ellipse cx="200" cy="150" rx="150" ry="58" stroke="#334155" stroke-width="1.5" fill="none"/>
  <ellipse cx="200" cy="150" rx="185" ry="74" stroke="#334155" stroke-width="1.5" fill="none"/>
  <!-- Orbiting Planets -->
  <!-- Mercury -->
  <circle cx="140" cy="138" r="5" fill="#94A3B8"/>
  <!-- Venus -->
  <circle cx="260" cy="125" r="7" fill="#F59E0B"/>
  <!-- Earth & Moon -->
  <circle cx="105" cy="170" r="9" fill="#0284C7"/>
  <circle cx="118" cy="165" r="2.5" fill="#E2E8F0"/>
  <!-- Mars -->
  <circle cx="310" cy="180" r="6" fill="#EF4444"/>
  <!-- Jupiter with Great Red Spot -->
  <circle cx="50" cy="130" r="16" fill="#F97316"/>
  <line x1="36" y1="130" x2="64" y2="130" stroke="#C2410C" stroke-width="2"/>
  <!-- Saturn with Rings -->
  <ellipse cx="340" cy="115" rx="20" ry="5" stroke="#FDE047" stroke-width="2" fill="none" transform="rotate(-15 340 115)"/>
  <circle cx="340" cy="115" r="11" fill="#EAB308"/>
  <!-- Motorized Kit Base -->
  <rect x="150" y="250" width="100" height="24" rx="6" fill="#173B67" stroke="#285A91" stroke-width="2"/>
  <text x="200" y="266" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F6C94B" text-anchor="middle">MOTORIZED KIT</text>
</svg>
