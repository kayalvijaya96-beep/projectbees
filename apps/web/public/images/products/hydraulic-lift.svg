<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" rx="16" fill="#F0F5FA"/>
  <rect x="30" y="240" width="340" height="20" rx="4" fill="#D9E4EF" stroke="#173B67" stroke-width="2"/>
  <!-- Scissor Mechanism -->
  <line x1="80" y1="240" x2="160" y2="150" stroke="#173B67" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="240" x2="80" y2="150" stroke="#173B67" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="195" r="5" fill="#F6C94B" stroke="#173B67" stroke-width="2"/>
  <line x1="80" y1="150" x2="160" y2="60" stroke="#173B67" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="150" x2="80" y2="60" stroke="#173B67" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="105" r="5" fill="#F6C94B" stroke="#173B67" stroke-width="2"/>
  <!-- Top Platform -->
  <rect x="50" y="48" width="140" height="14" rx="4" fill="#F6C94B" stroke="#173B67" stroke-width="2.5"/>
  <!-- Elevated Toy Car -->
  <rect x="80" y="24" width="70" height="24" rx="6" fill="#285A91"/>
  <circle cx="95" cy="46" r="6" fill="#173B67"/>
  <circle cx="135" cy="46" r="6" fill="#173B67"/>
  <!-- Syringes & Hydraulic Tube -->
  <rect x="230" y="180" width="30" height="60" rx="4" fill="#FFFFFF" stroke="#173B67" stroke-width="2.5"/>
  <rect x="234" y="200" width="22" height="38" fill="#38BDF8" fill-opacity="0.5"/>
  <line x1="245" y1="180" x2="245" y2="140" stroke="#173B67" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="140" x2="260" y2="140" stroke="#173B67" stroke-width="4" stroke-linecap="round"/>
  <!-- Larger Syringe / Output Cylinder -->
  <rect x="150" y="195" width="24" height="45" rx="3" fill="#FFFFFF" stroke="#173B67" stroke-width="2"/>
  <rect x="153" y="205" width="18" height="32" fill="#38BDF8" fill-opacity="0.6"/>
  <!-- Connecting Fluid Tube -->
  <path d="M162 240 Q 200 270 245 240" stroke="#0284C7" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Pascal's Law Label -->
  <rect x="250" y="40" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#285A91" stroke-width="1.5"/>
  <text x="310" y="59" font-family="sans-serif" font-size="11" font-weight="bold" fill="#173B67" text-anchor="middle">P₁ = P₂ (Pascal)</text>
</svg>
