  <ellipse cx="200" cy="265" rx="70" ry="16" fill="#D9E4EF" stroke="#173B67" stroke-width="2"/>
  <rect x="196" y="200" width="8" height="65" fill="#64748B"/>
  <!-- Superior Vena Cava & Aorta -->
  <path d="M170 120 C 160 50, 220 50, 225 110" stroke="#E11D48" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M150 130 L 150 70" stroke="#0284C7" stroke-width="18" stroke-linecap="round"/>
  <!-- Heart Muscle Body -->
  <path d="M200 215 C 130 180, 110 130, 150 100 C 180 80, 200 120, 200 120 C 200 120, 220 80, 250 100 C 290 130, 270 180, 200 215 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
  <!-- Dissectible Seam -->
  <path d="M200 120 Q 205 160 195 210" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Right Ventricle detail -->
  <path d="M155 140 Q 170 170 185 190" stroke="#B91C1C" stroke-width="3" fill="none"/>
  <!-- Coronary Vessels -->
  <path d="M190 130 Q 180 160 160 185" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <path d="M205 130 Q 220 165 240 185" stroke="#EF4444" stroke-width="2" fill="none"/>
  <!-- 3D Dissectible Label Pill -->
  <rect x="260" y="30" width="115" height="28" rx="14" fill="#173B67"/>
  <text x="317" y="48" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F6C94B" text-anchor="middle">2-PART DISSECTIBLE</text>
</svg>
